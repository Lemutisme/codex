[package]
name = "codex-pro-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_pro_contract"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
ignore = { workspace = true }
serde = { workspace = true, features = ["derive"] }
